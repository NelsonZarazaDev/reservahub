services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - 5432:5432

    environment:
      POSTGRES_DB: reservationhub
      POSTGRES_USER: reservationhub
      POSTGRES_PASSWORD: BOEiM&M5Cuxj^wjOQqWS

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservationhub -d reservationhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: